<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div {
        text-align: center;
    }

    container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
    }

    button {
        margin: 10px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
    }
</style>

<body>
    <h1>Date Constructor in javascript</h1>
    <div class="container">
        <h2>Age Calculator</h2>
        <input type="date" id="dob">
        <br>
        <button id="calculateButton">Calculate Age</button>
        <button id="calculateDaysButton">Calculate Age in Days</button>
        <button id="calculateHoursButton">Calculate Age in Hours</button>
        <button id="calculateMinutesButton">Calculate Age in Minutes</button>
        <button id="calculateSecondsButton">Calculate Age in Seconds</button>
        <button id="clockButton">Show Current Time</button>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
